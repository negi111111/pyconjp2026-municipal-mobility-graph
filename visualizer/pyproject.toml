[project]
name = "pyconjp2026-mobility-kg-visualizer"
version = "0.1.0"
description = "Local visual audit UI for Phase 1-3 Mobility Knowledge Graph evolution"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "streamlit>=1.40",
    "streamlit-agraph>=0.0.45",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
