[project]
name = "pyconjp2026-mobility-kg"
version = "1.0.0"
description = "Public-data mobility knowledge graph and natural-language regional exploration"
requires-python = ">=3.10"

dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "pipeline", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
